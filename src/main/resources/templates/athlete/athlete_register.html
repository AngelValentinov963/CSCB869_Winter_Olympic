<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация на спортист</title>

</head>
<body>

<div th:replace="~{layout/header :: header}"></div>
<form id="athleteForm">
    <input type="text" id="firstName" placeholder="Име" required><br>
    <input type="text" id="lastName" placeholder="Фамилия" required><br>
    <input type="text" id="country" placeholder="Държава" required><br>
    <select id="gender">
        <option value="MALE">Male</option>
        <option value="FEMALE">Female</option>
    </select><br>
    <input type="date" id="birthDate" required><br>
    <button type="submit">Регистрирай</button>
</form>

<script>
    document.getElementById('athleteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            country: document.getElementById('country').value,
            gender: document.getElementById('gender').value,
            birthDate: document.getElementById('birthDate').value
        };

        fetch('/api/athletes/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(response => {
            if (response.ok) alert("Successful registration!");
            else alert("Error with registration!");
        });
    });
</script>
</body>
</html>
