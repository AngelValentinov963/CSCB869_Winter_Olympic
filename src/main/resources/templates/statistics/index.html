<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Olympic Statistics</title>

    <link rel="stylesheet"
          href="/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Olympic Statistics</h2>

<hr>

<h3>Competitions</h3>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>Name</th>
        <th>Gender</th>
        <th>Min Age</th>
        <th></th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="competition : ${competitions}">

        <td th:text="${competition.name}"></td>

        <td th:text="${competition.allowedGender}"></td>

        <td th:text="${competition.minAge}"></td>

        <td>

            <a class="btn btn-primary"
               th:href="@{/statistics/{id}(id=${competition.id})}">
                Results
            </a>

        </td>

    </tr>

    </tbody>

</table>

<hr>

<h3>Medal Table</h3>

<table class="table table-striped">

    <thead>

    <tr>

        <th>Country</th>
        <th>Medals</th>

    </tr>

    </thead>

    <tbody>

    <tr th:each="entry : ${medalTable.entrySet()}">

        <td th:text="${entry.key}"></td>

        <td th:text="${entry.value}"></td>

    </tr>

    </tbody>

</table>

<hr>

<h3>Average Age</h3>

<h4 th:text="${averageAge}"></h4>

<hr>

<h3>Youngest Medalist</h3>

<div th:if="${youngestMedalist!=null}">

    <b th:text="${youngestMedalist.firstName + ' ' + youngestMedalist.lastName}"></b>

    (<span th:text="${youngestMedalist.country}"></span>)

</div>

<hr>

<h3>Oldest Medalist</h3>

<div th:if="${oldestMedalist!=null}">

    <b th:text="${oldestMedalist.firstName + ' ' + oldestMedalist.lastName}"></b>

    (<span th:text="${oldestMedalist.country}"></span>)

</div>

</body>
</html>
